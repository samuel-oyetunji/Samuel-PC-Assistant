[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "samuel-pc-assistant"
version = "2.1.0"
description = "A voice-controlled desktop assistant for Windows and macOS"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "Samuel Oyetunji"}]

[tool.setuptools.packages.find]
include = ["samuel*"]
